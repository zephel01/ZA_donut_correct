name: version check

# バージョンの書かれている場所（ZA_donut_correct.py の VERSION / NAME、README・docs の版表示、CHANGELOG）が
# そろっているかを確かめる。NAME が文字列リテラルか（PCME 0.2.0 で一覧に出るか）も確かめる。
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: バージョンがそろっているか
        run: python tools/bump_version.py --check

      - name: タグとバージョンが同じか（タグを push したときだけ）
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(python tools/bump_version.py --print)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::タグ ${GITHUB_REF_NAME} と ZA_donut_correct.py の VERSION (${version}) が違います"
            exit 1
          fi
          echo "OK: タグ ${GITHUB_REF_NAME} と VERSION が一致"
